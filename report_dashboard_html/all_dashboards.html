<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maintenance Data Dashboard V4 - 전체 보고용 HTML</title>
  <style>
    :root{--bg:#040d1a;--side:#050f1a;--panel:#0f2940;--inner:#07111e;--line:#1e3a5f;--line2:#1c2d3f;--cyan:#00d4ff;--green:#00ff88;--orange:#ffa500;--red:#ff4444;--purple:#a78bfa;--text:#f8fafc;--muted:#8b97a8}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Pretendard,"Segoe UI",Arial,sans-serif;overflow:hidden}button,input,select{font:inherit}
    .app{display:flex;height:100vh}.top{position:fixed;top:0;left:250px;right:0;height:54px;background:rgba(5,15,26,.97);border-bottom:1px solid var(--line2);display:flex;align-items:center;justify-content:space-between;padding:0 20px;z-index:4}.brand{font-weight:900}.db{display:flex;align-items:center;gap:8px;color:var(--green);font-size:12px;border:1px solid rgba(0,255,136,.3);background:rgba(0,255,136,.08);border-radius:8px;padding:7px 10px}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}
    aside{width:250px;background:var(--side);border-right:1px solid var(--line2);height:100vh;overflow-y:auto;padding:12px}.logo{font-weight:900;margin:6px 8px 14px;color:#eaf2ff}.sec{border-top:1px solid var(--line2);margin:10px 6px 6px;padding-top:12px;color:#64748b;font-size:11px;font-weight:900;letter-spacing:.04em}.nav{width:100%;border:0;background:transparent;color:#aab4c2;text-align:left;border-radius:8px;padding:7px 9px;margin:1px 0;font-size:12px;cursor:pointer}.nav:hover{background:#0a1525;color:white}.nav.active{background:var(--cyan);color:white;box-shadow:0 0 16px rgba(0,212,255,.18)}.sub{margin-left:12px;padding-left:9px;border-left:2px solid var(--line)}
    main{flex:1;margin-top:54px;padding:18px;overflow-y:auto}.page{display:none}.page.active{display:block}.head{display:flex;justify-content:space-between;gap:16px;margin-bottom:14px}h1{margin:0 0 6px;font-size:22px}.desc{font-size:12px;color:var(--muted)}.sync{font-size:12px;color:#9fb3c8;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;height:max-content}
    .grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g5{grid-template-columns:repeat(5,minmax(0,1fr))}.span2{grid-column:span 2}.span3{grid-column:span 3}
    .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;min-width:0}.title{font-size:14px;font-weight:900;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}.tag{font-size:10px;font-weight:900;color:var(--cyan);background:rgba(0,212,255,.12);border-radius:999px;padding:4px 7px}.klabel{font-size:12px;color:#a4adba;margin-bottom:8px}.kvalue{font-size:28px;font-weight:900;line-height:1}.ksub{font-size:11px;color:#6d7a8c;margin-top:8px}.cyan{color:var(--cyan)}.green{color:var(--green)}.orange{color:var(--orange)}.red{color:var(--red)}.purple{color:var(--purple)}
    .chart{height:250px;background:var(--inner);border:1px solid var(--line);border-radius:8px;padding:10px}.bar{display:grid;grid-template-columns:120px 1fr 54px;gap:10px;align-items:center;margin:10px 0}.bar span{font-size:12px;color:#cbd5e1}.track{height:9px;background:#06101d;border-radius:99px;overflow:hidden}.fill{height:100%;border-radius:99px}
    .table{overflow-x:auto;border:1px solid var(--line);border-radius:8px}table{width:100%;border-collapse:collapse;font-size:12px}th{background:#0a1929;color:#8794a6;text-align:left;padding:9px;white-space:nowrap}td{border-top:1px solid rgba(30,58,95,.75);padding:9px;color:#d0dae7;white-space:nowrap}tr:hover td{background:rgba(10,25,41,.6)}.badge{border-radius:999px;padding:3px 7px;font-size:10px;font-weight:900}.ok{background:rgba(0,255,136,.13);color:var(--green)}.warn{background:rgba(255,165,0,.13);color:var(--orange)}.bad{background:rgba(255,68,68,.13);color:var(--red)}
    .form{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}input,select{min-width:0;background:var(--inner);border:1px solid var(--line);color:#dbe4ef;border-radius:8px;padding:8px;font-size:12px;outline:none}.btn{border:0;border-radius:8px;background:var(--cyan);color:#07111e;font-size:12px;font-weight:900;padding:8px;cursor:pointer}.list{display:grid;gap:8px}.item{background:var(--inner);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;display:flex;justify-content:space-between;gap:10px}.alarm{border-color:rgba(255,68,68,.45);background:rgba(255,68,68,.08)}
    @media(max-width:1250px){.g5,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.span2,.span3{grid-column:auto}.top{left:250px}}
  </style>
</head>
<body>
<div class="app">

  </aside>
  <div class="top"><div class="brand">SK실트론 기계팀 설비 유지보수 통합 대시보드</div><div class="db"><span class="dot"></span> DB 연동 화면 · PostgreSQL mdd_db · Snapshot 2026-05-03 14:42</div></div>
  <main id="main"></main>
</div>
<script>
const pageIds=['dashboard','alarm','ai','equipment','chiller','air','compressor','boiler','pcw','pvac','arp','analyzer','exhaust','detector','fdc','hmi','fms','energy','workorder','pm','daily','weekly','monthly','costRepair','costService','inventory','compliance'];
const main=document.getElementById('main'); pageIds.forEach((id,i)=>{const s=document.createElement('section');s.id=id;s.className='page'+(i===0?' active':'');main.appendChild(s)});
const C={cyan:'#00d4ff',green:'#00ff88',orange:'#ffa500',red:'#ff4444',purple:'#a78bfa',mint:'#4ecdc4'};
const work=[['WO-3P-263035','보일러 버너 연소 상태 점검','Boiler #2','기계(3P)','작성 중','2026-05-12'],['WO-2P-262034','냉각수 펌프 진동 점검 후 시운전','PCW Pump #1','기계(2P)','확정','2026-05-09'],['WO-1P-261030','Gas 분석기 Sample Flow 점검','O2 Analyzer #2','기계(1P)','확정','2026-04-30'],['WO-3P-263001','Ar Purifier Regeneration 확인','Ar Purifier #1','기계(3P)','작성 중','2026-03-05'],['WO-1P-261002','공조기 필터 차압 점검 후 시운전','공조기 #3','기계(1P)','작성 대기','2026-03-05']];
const inv=[['Pump Seal','SIC 45A','18','10','135,000','A-01-03','Critical','정상'],['AHU Filter','610x610 HEPA','7','12','82,000','B-03-01','A','부족'],['Bearing','6205ZZ','42','20','18,000','C-02-05','B','정상'],['Gas Sensor Cell','SiH4','3','5','420,000','D-01-02','Critical','부족']];
function head(t,d){return `<div class="head"><div><h1>${t}</h1><div class="desc">${d}</div></div><div class="sync">DB 조회 성공 · cache hit · latency 18ms</div></div>`}
function kpis(a){return `<div class="grid g4">${a.map(x=>`<div class="card" style="border-color:${x[3]}55"><div class="klabel">${x[0]}</div><div class="kvalue" style="color:${x[3]}">${x[1]}<span style="font-size:12px;margin-left:4px">${x[2]||''}</span></div><div class="ksub">${x[4]||''}</div></div>`).join('')}</div>`}
function stat(s){return ['정상','확정','완료'].includes(s)?'ok':(['주의','작성 중','작성 대기','예정','갱신예정','부족'].includes(s)?'warn':'bad')}
function table(h,r){return `<div class="table"><table><thead><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${r.map(row=>`<tr>${row.map((c,i)=>h[i]==='상태'?`<td><span class="badge ${stat(c)}">${c}</span></td>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function bars(a){return a.map(x=>`<div class="bar"><span>${x[0]}</span><div class="track"><div class="fill" style="width:${Math.min(x[1],100)}%;background:${x[2]}"></div></div><span>${x[1]}%</span></div>`).join('')}
function chart(id,color){let pts=[34,46,42,58,49,65,61,76,68,84,79,92],w=620,h=210,p=pts.map((v,i)=>`${i*w/(pts.length-1)},${h-(v-25)/75*h}`).join(' ');return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="100%"><defs><linearGradient id="${id}" x1="0" x2="0" y1="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".32"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${[0,1,2,3].map(i=>`<line x1="0" x2="${w}" y1="${i*h/3}" y2="${i*h/3}" stroke="#1e3a5f" stroke-dasharray="4 4"/>`).join('')}<polygon points="0,${h} ${p} ${w},${h}" fill="url(#${id})"/><polyline points="${p}" fill="none" stroke="${color}" stroke-width="4" stroke-linecap="round"/></svg>`}
function trendBlock(title,id,color){return `<div class="card span2"><div class="title">${title}<span class="tag">DB Trend</span></div><div class="chart">${chart(id,color)}</div></div>`}
function equipmentPage(id,title,desc,metrics,rows,points){document.getElementById(id).innerHTML=head(title,desc)+kpis(metrics)+`<div class="grid g3" style="margin-top:12px">${trendBlock('실시간 운전 Trend',id+'c',metrics[0][3])}<div class="card"><div class="title">이상 감지 포인트</div><div class="list">${points.map((p,i)=>`<div class="item ${i===0?'alarm':''}"><span>${p}</span><b class="${i===0?'red':i<3?'orange':'cyan'}">${i===0?'위험':i<3?'주의':'감시'}</b></div>`).join('')}</div></div></div><div class="card" style="margin-top:12px"><div class="title">운전 현황</div>${table(['설비ID','설비명','운전상태','현재값','보조정보','상태'],rows)}</div>`}
function render(){
dashboard.innerHTML=head('통합 대시보드','전체 설비, 에너지, 작업보고, 점검, 비용, 재고, 법규 현황을 한 화면에서 봅니다.')+kpis([['전체 설비','675','대',C.cyan,'master sync'],['정상 설비','641','대',C.green,'94.9%'],['작업보고','108','건',C.orange,'Excel 업로드 완료'],['위험 알람','9','건',C.red,'미조치 3건']])+`<div class="grid g3" style="margin-top:12px">${trendBlock('종합 운영 Trend','dash',C.cyan)}<div class="card"><div class="title">최근 작업보고</div>${table(['WO No','작업명','상태'],work.map(w=>[w[0],w[1],w[4]]))}</div></div>`;
alarm.innerHTML=head('알람&이벤트','설비 알람, 이벤트, 처리상태를 DB 이력처럼 조회합니다.')+kpis([['전체 알람','18','건',C.cyan],['Critical','5','건',C.red],['Warning','9','건',C.orange],['처리완료','4','건',C.green]])+`<div class="card" style="margin-top:12px">${table(['시간','설비','내용','등급','상태'],[['14:32','CH-02','냉수 온도 상승','Critical','위험'],['14:15','FAN-05','진동 수치 이상','Warning','주의'],['13:58','PCW-P01','압력 저하 감지','Critical','위험'],['13:45','CT-01','수질 TDS 초과','Warning','완료']])}</div>`;
ai.innerHTML=head('AI 예측','설비 이상 예측과 신뢰도, D-Day를 보고용으로 표시합니다.')+kpis([['예측 항목','5','건',C.purple],['고위험','3','건',C.red],['평균 신뢰도','86.4','%',C.green],['7일 이내','4','건',C.orange]])+`<div class="grid g3" style="margin-top:12px">${trendBlock('예측 위험도 Trend','aiT',C.purple)}<div class="card"><div class="title">예측 목록</div><div class="list">${['CH-03 압축기 진동 이상 D-3','HLT-RE #1 밸브 고장 D-2','GIS #2 수소 누설 예측 D-4','PUMP-12 효율 저하 D-9'].map((x,i)=>`<div class="item"><span>${x}</span><b class="${i<2?'red':'orange'}">${i<2?'High':'Warn'}</b></div>`).join('')}</div></div></div>`;
equipment.innerHTML=head('설비 현황','공장별, 유형별 설비 상태와 가동률을 표시합니다.')+kpis([['P1','245','대',C.cyan,'94.7%'],['P2','230','대',C.green,'94.8%'],['P3','200','대',C.orange,'92.5%'],['위험','9','대',C.red,'즉시 조치']])+`<div class="grid g3" style="margin-top:12px"><div class="card"><div class="title">유형별 현황</div>${bars([['냉동기',95,C.cyan],['공조기',96,C.green],['Compressor',91,C.orange],['배기 Fan',89,C.red],['Gas 감지기',98,C.purple]])}</div>${trendBlock('설비 가동률 Trend','eq',C.green)}</div>`;
equipmentPage('chiller','냉동기 Dashboard','냉수 공급온도, 냉각수, 압축기 전류, COP를 관리합니다.',[['냉수 공급','6.5','°C',C.cyan],['냉각수 입구','29.2','°C',C.green],['전력','125','kW',C.orange],['COP','5.4','',C.purple]],[['CH-01','냉동기 #1','운전','6.5°C','COP 5.4','정상'],['CH-02','냉동기 #2','운전','6.8°C','압력 4.1bar','정상'],['CH-03','냉동기 #3','운전','8.2°C','상한 접근','주의']],['냉수 온도 상승','냉각수 유량 부족','압축기 과전류','COP 저하']);
equipmentPage('air','공조기 Dashboard','온습도, 차압, 필터, Fan 상태를 FAB 환경 기준으로 관리합니다.',[['Room Temp','22.5','°C',C.cyan],['습도','55.2','%',C.green],['차압','-10','Pa',C.orange],['Particle','9.8K','',C.purple]],[['AHU-01','공조기 #1','Auto','22.5°C','Filter 정상','정상'],['AHU-02','공조기 #2','Auto','58%','습도 상승','주의'],['AHU-03','공조기 #3','Manual','-6Pa','차압 저하','위험']],['온도 기준 이탈','습도 상승','필터 차압 초과','Fan 이상']);
equipmentPage('compressor','Compressor Dashboard','CDA, IA 압축공기 압력, Dew Point, Load/Unload를 표시합니다.',[['토출 압력','7.1','bar',C.cyan],['Dew Point','-46','°C',C.green],['유량','18.4K','N㎥/h',C.mint],['원단위','0.108','kWh/N㎥',C.orange]],[['CMP-01','CDA Compressor #1','Load','7.2bar','Dryer 정상','정상'],['CMP-02','CDA Compressor #2','Unload','6.8bar','Dew 상승','주의'],['CMP-03','IA Compressor #1','Stand-by','7.0bar','예비기','정상']],['토출 압력 저하','Dew Point 상승','Dryer 이상','누설 의심']);
equipmentPage('boiler','보일러 Dashboard','스팀 압력, 온수, 급수, 배기가스 온도, LNG 사용량을 표시합니다.',[['스팀 압력','8.2','bar',C.orange],['온수 공급','72.4','°C',C.cyan],['배기가스','218','°C',C.red],['LNG','42.8K','Nm³',C.green]],[['BLR-01','Boiler #1','버너 ON','8.4bar','효율 91%','정상'],['BLR-02','Boiler #2','운전','7.7bar','배기온 상승','주의'],['BLR-03','Boiler #3','Stand-by','대기','연료 정상','정상']],['압력 저하','급수 이상','배기가스 온도 상승','연료 사용량 급증']);
